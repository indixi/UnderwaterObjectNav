perception:
  detector:
    enabled: true
    config_path: "../perception/model/gfl_r50_fpn_underwater_objectnav_inference.py"
    checkpoint_path: "../perception/model/best_echinus_recall_at_precision_95_epoch_5.pth"
    threshold_file: "../perception/model/echinus_threshold.json"
    candidate_score_threshold: 0.001
    score_threshold: 0.50  # fallback for rock
    classes:
      - echinus
      - rock

camera:
  width: 640
  height: 480
  horizontal_fov_deg: 70.0
  fx: 457.01
  fy: 457.01
  cx: 319.5
  cy: 239.5
  nominal_sensor_world_z_m: 3.3
  sensor_height_tolerance_m: 0.10
  T_base_camera:
    translation_m: [0.20, 0.0, -0.02]
    rpy_rad: [1.5707963268, 0.0, 1.5707963268]

depth:
  min_depth_m: 0.20
  max_depth_m: 10.0
  echinus_center_roi_ratio: 0.40
  echinus_min_roi_size_px: 5
  echinus_min_valid_depth_pixels: 3
  rock_center_roi_ratio: 0.40
  rock_depth_stride: 4
  rock_depth_gate_m: 0.20
  rock_min_valid_depth_pixels: 3
  obstacle_depth_stride: 4
  obstacle_z_min_offset_from_sensor_m: -0.15
  obstacle_z_max_offset_from_sensor_m: 0.19

map:
  global:
    origin_x: -7.0
    origin_y: -4.0
    width_m: 14.0
    height_m: 8.0
    resolution_m: 0.10
  local:
    # Robot-centred egocentric map. Width and height may be changed separately.
    width_m: 3.0
    height_m: 3.0
    resolution_m: 0.05
  robot_marker_radius_m: 0.20
  visited_radius_m: 0.20
  echinus_marker_radius_m: 0.10

target:
  bearing_scale_rad: 0.6108652382  # 35 degrees
  distance_scale_m: 10.0

dataset:
  include_failed_episodes: false
  map_storage_dtype: float16
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42

model:
  global_map_channels: 6
  local_map_channels: 4
  global_pool_size: [5, 9]
  local_pool_size: [4, 4]
  global_feature_dim: 256
  local_feature_dim: 128
  goal_embedding_dim: 8
  target_feature_dim: 16
  num_actions: 4

training:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.00001
  epochs: 30
  workers: 2
  seed: 42
