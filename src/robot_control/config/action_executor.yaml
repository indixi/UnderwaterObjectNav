action_executor:
  vehicle_name: bricsbot
  odom_topic: /bricsbot/odometry
  request_topic: /underwater_objectnav/action_request
  reference_topic: /aquaflow/nominal_pose
  status_topic: /underwater_objectnav/action_status
  frame_id: world_ned
  rate_hz: 20.0

  command_delay_s: 5.0
  initial_command_delay_s: 0.0
  forward_distance_m: 0.25
  backward_distance_m: 0.25
  turn_angle_deg: -15.0 #由于z轴朝下，这里右转其实是-30.0度
  odom_timeout_s: 0.25
  forward_position_tolerance_m: 0.035
  turn_angle_tolerance_deg: 3.0
  action_timeout_s: 15.0

  # Stonefish world_ned: positive z points down. Reach this depth before
  # executing queued keyboard actions, then keep publishing it while idle.
  target_z: 3.0
  initialize_depth_before_actions: true
  depth_tolerance_m: 0.05
  depth_settle_time_s: 0.5
  hold_reference_when_idle: true
